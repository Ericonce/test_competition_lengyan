name: modular_resnet1d_multigrain
type: modular_resnet1d_hypothesis
in_channels: 3
base_channels: 64
stream_embedding_dim: 256
contrast_dim: 128
dropout: 0.1

# Hypothesis-IQ classification branch.
hypothesis_for_classification: true
hypothesis_signal_length: 64
hypothesis_pulses_per_sequence: 8
hypothesis_hidden_dim: 64
hypothesis_modulation_type: random
hypothesis_modulation_types:
  - lfm
  - nlfm
  - fsk
  - bpsk
  - lfm_fsk
  - lfm_bpsk
hypothesis_num_modes: 6
hypothesis_signal_mode: full
hypothesis_frequency_jitter: 0.08
hypothesis_width_jitter: 0.04
hypothesis_phase_jitter: true
hypothesis_envelope_steepness: 48.0
hypothesis_condition_alignment: paired
classification_hypothesis_randomize: false
contrast_hypothesis_randomize: true

# Optional fallback for future GAN/domain alignment experiments.
adversarial_alignment: false
grl_lambda: 0.1
