# 合成 CF/PW/PRI：采样、划分、输入长度与补长策略由本 pipeline 控制。
# train/inference 字段可在入口的 model.train()/model.infer() 中覆盖，代码优先。
# inference.progress 控制读取和预测进度；labels_file=null 只预测。
name: pulse_hypothesis_fused_synthetic
task: classify
data: datasets/synthetic_radar_overlap/data.yaml
model: configs/model/pulse_hypothesis_cnn_fused.yaml
output_dir: results/pulse_hypothesis_fused_synthetic
dataset:
  sample_ratio: 0.01
  train_ratio: 0.8
  val_ratio: 0.2
  seed: 2026
  stratified: true
sequence_length: 256
length_policy:
  short: zero
  long: head
train:
  visualize: true  # false 跳过结果绘图和 t-SNE；指标与权重仍保存。
  reporting:
    dpi: 300  # 训练结束后自动保存曲线；仅验证集生成分类分析图。
    formats: [png, svg, pdf]
    tsne:
      max_samples: 3000  # 按类别采样；0 使用全部验证样本，指标和矩阵始终用全部样本。
      seed: 2026
      perplexity: 30.0  # 样本少时自动调低，保证小于样本数。
      max_iter: 1000
  num_classes: null  # 训练类别数；null 读取训练 data.yaml，可填写 10、100 等正整数
  resume: false
  resume_checkpoint: null
  seed: 2026
  epochs: 40
  batch_size: 64
  num_workers: 0
  sampler: random
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 6
  use_amp: true
  device: auto
augment:
  preset: configs/augment/default.yaml
  enabled: false
inference:
  num_classes: null  # 推理输出类别数；null 读取权重，填写整数时以此为准；新增未训练类别的概率为 0
  progress: true
  checkpoint: null
  labels_file: null
  save_dir: null
  batch_size: 256
loss:
  ce:
    label_smoothing: 0.0  # 0 关闭标签平滑；可在 train.py 用 labelsmooth 覆盖。
    weight: 1.0
    class_weights: null
  stream_infonce:
    mode: supervised
    weight: 0.1
    temperature: 0.2
  pulse_infonce:
    mode: supervised_cross_modal
    weight: 0.02
    temperature: 0.2
    pulses_per_sequence: 8
