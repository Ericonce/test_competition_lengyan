# Global defaults for PulseCLS train / val / predict.
# Experiment YAMLs under configs/pipeline override these.

task: classify
mode: train

pipeline: configs/pipeline/cnn_softmax_synthetic.yaml
model: configs/model/cnn1d.yaml
data: datasets/synthetic_radar_overlap/data.yaml
output_dir: results/cnn_softmax_synthetic_overlap

# Train
num_classes: null  # null reads data.yaml; explicit values set the training classifier size.
device: auto  # Prefer NVIDIA CUDA, then Ascend NPU, then CPU.
seed: 2026
epochs: 20
resume: false
resume_checkpoint:
batch_size: 256
num_workers: 0
sampler: random
optimizer: adamw
lr: 0.001
weight_decay: 0.0001
early_stopping_patience: 6
use_amp: true
amp_dtype: float16  # auto selects BF16 on supported NPU devices; CUDA keeps FP16.
normalization:
  method: zscore  # zscore, minmax, maxabs, robust, log_zscore, none
  eps: 0.000001
  feature_range: [0.0, 1.0]  # minmax can also use [-1.0, 1.0].
  quantile_range: [25.0, 75.0]  # robust scaling uses this percentile interval.
  clip: false  # minmax only; false preserves values beyond the training range.
progress_metric_interval: 10  # Batch interval for copying progress metrics from the accelerator.
two_views: true
metrics_prior_alpha: 0.0
visualize: true  # Save training figures and validation t-SNE; false skips plotting.
reporting:
  dpi: 300
  formats: [png, svg, pdf]
  tsne:
    max_samples: 3000  # 0 uses all validation sequences; otherwise sample by class.
    seed: 2026
    perplexity: 30.0
    max_iter: 1000

# Sequence augment (Ultralytics image policies mapped onto PDW streams)
time_shift_ratio: 0.0
time_flip_prob: 0.0
mixup_prob: 0.0
mixup_alpha: 0.2

# Predict
split: val
checkpoint:
save_dir:
